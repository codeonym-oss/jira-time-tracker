name: build

# Builds the sdist and wheel, validates their metadata, and smoke-tests an install of each in a
# clean environment. Called by CI (every PR) and by the release workflow (before publishing).

on:
  workflow_call:
    inputs:
      dev:
        description: Build a X.Y.(Z+1).devN pre-release (N = the caller's run number) for TestPyPI.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Set dev version
        if: inputs.dev
        run: |
          base=$(uv version --short)
          IFS=. read -r major minor patch <<< "$base"
          uv version --frozen "$major.$minor.$((patch + 1)).dev${{ github.run_number }}"
      - id: version
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"
      - run: uv build
      - name: Check metadata renders on PyPI
        run: uvx twine check --strict dist/*
      - name: Smoke-test the wheel and the sdist
        env:
          EXPECTED: jira-time-tracker ${{ steps.version.outputs.version }}
        run: |
          for dist in dist/*.whl dist/*.tar.gz; do
            uv venv -q "/tmp/smoke" --clear
            uv pip install -q --python /tmp/smoke "$dist"
            got=$(/tmp/smoke/bin/jtt --version)
            if [[ "$got" != "$EXPECTED" ]]; then
              echo "::error::$dist: jtt --version printed '$got', expected '$EXPECTED'"; exit 1
            fi
            /tmp/smoke/bin/jira-time-tracker --help > /dev/null
            echo "ok $dist: $got"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
